<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0;padding:0;background-color:#fbf8f9;">
  <tr>
    <td align="center" style="padding:28px 16px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:440px;margin:0 auto;">
        <tr>
          <td align="center" style="padding:0 0 18px;">
            <p style="margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.04em;color:#c2415b;">
              Couple Space
            </p>
          </td>
        </tr>
        <tr>
          <td style="background-color:#ffffff;border:1px solid #eadfe3;border-radius:16px;overflow:hidden;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td style="padding:22px 24px 8px;background:linear-gradient(165deg,#f7e3e8 0%,#ffffff 72%);">
                  <p style="margin:0 0 6px;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#8a7480;">
                    Đăng nhập
                  </p>
                  <h1 style="margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.3;color:#2a1f26;">
                    Mã của bạn
                  </h1>
                </td>
              </tr>
            </table>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td style="padding:8px 24px 6px;">
                  <p style="margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.55;color:#8a7480;">
                    Nhập mã này trong app. Không chia sẻ cho ai.
                  </p>
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:16px 24px 8px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td align="center" style="background-color:#f7e3e8;border-radius:14px;padding:18px 28px;">
                        <p style="margin:0;font-family:'Be Vietnam Pro',ui-monospace,Menlo,Consolas,monospace;font-size:36px;font-weight:600;letter-spacing:0.28em;line-height:1;color:#c2415b;">
                          {{ .Token }}
                        </p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td style="padding:10px 24px 24px;">
                  <p style="margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;line-height:1.55;color:#8a7480;">
                    Mã hết hạn sau khoảng 1 giờ. Nếu bạn không yêu cầu đăng nhập, cứ bỏ qua email này.
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:18px 8px 0;">
            <p style="margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:12px;line-height:1.5;color:#8a7480;">
              Chỉ dành cho hai người trong không gian của bạn.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
